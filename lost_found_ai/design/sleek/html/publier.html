<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PublierUneAnnonce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #fbf7f0;
        --foreground: #141b3d;
        --primary: #4338e8;
        --primary-foreground: #ffffff;
        --secondary: #eceafb;
        --secondary-foreground: #2e2a8f;
        --muted: #f2eee7;
        --muted-foreground: #5b6180;
        --accent: #ddf5ec;
        --accent-foreground: #0b6b4f;
        --destructive: #c92a3f;
        --destructive-foreground: #ffffff;
        --card: #fffdf9;
        --card-foreground: #141b3d;
        --popover: #fffdf9;
        --popover-foreground: #141b3d;
        --border: #e8e1d4;
        --input: #fffcf6;
        --ring: #4338e8;
        --chart-1: #f2705f;
        --chart-2: #12a07a;
        --chart-3: #4338e8;
        --chart-4: #a9a3f0;
        --chart-5: #f6c3b8;

        --font-sans: "Manrope", sans-serif;
        --font-heading: "Plus Jakarta Sans", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-[844px] w-[390px] bg-background text-foreground font-sans relative pb-32">
      <div class="px-6 pt-14 pb-4 flex items-center gap-3">
        <div
          class="size-11 rounded-full bg-card border border-border flex items-center justify-center"
        >
          <iconify-icon icon="solar:alt-arrow-left-linear" width="20" height="20"></iconify-icon>
        </div>
        <h1 class="font-heading text-2xl font-bold tracking-tight">Publier une annonce</h1>
      </div>
      <div class="px-6">
        <div class="grid grid-cols-2 gap-1 rounded-2xl bg-muted p-1">
          <button
            class="h-12 rounded-xl bg-chart-1 text-white font-heading font-bold flex items-center justify-center gap-2 active:scale-[0.97] transition"
          >
            <iconify-icon icon="solar:magnifer-linear" width="20" height="20"></iconify-icon> J'ai
            perdu</button
          ><button
            class="h-12 rounded-xl text-muted-foreground font-heading font-semibold flex items-center justify-center gap-2 active:scale-[0.97] transition"
          >
            <iconify-icon icon="solar:hand-heart-linear" width="20" height="20"></iconify-icon> J'ai
            trouvé
          </button>
        </div>
      </div>
      <div class="px-6 mt-6 space-y-6">
        <div>
          <p class="font-heading font-semibold mb-3">Photo</p>
          <div
            class="aspect-[4/3] rounded-3xl border-2 border-dashed border-border bg-card flex flex-col items-center justify-center gap-2 text-center"
          >
            <div
              class="size-14 rounded-full bg-secondary text-primary flex items-center justify-center"
            >
              <iconify-icon icon="solar:camera-linear" width="28" height="28"></iconify-icon>
            </div>
            <p class="font-heading font-semibold">Ajouter une photo</p>
            <p class="text-sm text-muted-foreground">Une photo claire aide à retrouver l'objet</p>
          </div>
        </div>
        <div>
          <p class="font-heading font-semibold mb-3">Catégorie</p>
          <div class="flex flex-wrap gap-2">
            <span
              class="rounded-full bg-primary text-primary-foreground text-sm font-semibold px-4 py-2"
              >Sac</span
            ><span class="rounded-full bg-card border border-border text-sm font-medium px-4 py-2"
              >Téléphone</span
            ><span class="rounded-full bg-card border border-border text-sm font-medium px-4 py-2"
              >Clés</span
            ><span class="rounded-full bg-card border border-border text-sm font-medium px-4 py-2"
              >Carte</span
            ><span class="rounded-full bg-card border border-border text-sm font-medium px-4 py-2"
              >Autre</span
            >
          </div>
        </div>
        <div class="space-y-4">
          <div>
            <label class="font-heading font-semibold text-sm">Titre</label
            ><input
              type="text"
              class="mt-2 h-14 w-full rounded-2xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="Ex. Sac à dos bleu marine"
            />
          </div>
          <div>
            <label class="font-heading font-semibold text-sm">Description</label
            ><textarea
              rows="3"
              class="mt-2 w-full rounded-2xl border border-border bg-input px-4 py-3 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
              placeholder="Taille, marques, état, contenu visible…"
            ></textarea>
          </div>
          <div>
            <label class="font-heading font-semibold text-sm">Lieu</label>
            <div
              class="mt-2 h-14 rounded-2xl border border-border bg-input px-4 flex items-center gap-3"
            >
              <iconify-icon
                icon="solar:map-point-linear"
                class="text-muted-foreground"
                width="20"
                height="20"
              ></iconify-icon
              ><span class="text-base text-muted-foreground">Bibliothèque universitaire</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-heading font-semibold text-sm">Date</label>
              <div
                class="mt-2 h-14 rounded-2xl border border-border bg-input px-4 flex items-center gap-2"
              >
                <iconify-icon
                  icon="solar:calendar-linear"
                  class="text-muted-foreground"
                  width="20"
                  height="20"
                ></iconify-icon
                ><span class="text-base">Aujourd'hui</span>
              </div>
            </div>
            <div>
              <label class="font-heading font-semibold text-sm">Heure</label>
              <div
                class="mt-2 h-14 rounded-2xl border border-border bg-input px-4 flex items-center gap-2"
              >
                <iconify-icon
                  icon="solar:clock-circle-linear"
                  class="text-muted-foreground"
                  width="20"
                  height="20"
                ></iconify-icon
                ><span class="text-base">14:30</span>
              </div>
            </div>
          </div>
        </div>
        <div class="rounded-2xl bg-secondary p-4">
          <div class="flex items-center gap-2">
            <iconify-icon
              icon="solar:shield-keyhole-linear"
              class="text-primary"
              width="20"
              height="20"
            ></iconify-icon>
            <p class="font-heading font-semibold text-secondary-foreground">
              Détail secret (optionnel)
            </p>
          </div>
          <p class="text-sm text-muted-foreground mt-1">
            Un détail que seul le propriétaire connaît. Il servira à vérifier la restitution.
          </p>
          <input
            type="text"
            class="mt-3 h-12 w-full rounded-xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="Ex. Porte-clés en forme de canard"
          />
        </div>
      </div>
      <div
        class="absolute bottom-0 inset-x-0 bg-background/95 border-t border-border px-6 pt-4 pb-8"
      >
        <button
          class="h-14 w-full rounded-2xl bg-primary text-primary-foreground font-heading font-bold text-base flex items-center justify-center gap-2 active:scale-[0.97] transition"
        >
          <iconify-icon
            icon="material-symbols:flight-rounded"
            width="20"
            height="20"
          ></iconify-icon>
          Publier l'annonce
        </button>
      </div>
    </div>
  </body>
</html>
