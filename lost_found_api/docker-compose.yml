name: lost-found-api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lost-found-api:latest
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-lost_found}
      DB_USERNAME: ${DB_USERNAME:-lostfound}
      DB_PASSWORD: ${DB_PASSWORD:-lostfound2026}
      # E-mail : Mailpit (catch-all local) en dev. Les variables d'environnement
      # du conteneur priment sur le .env (Dotenv est immutable), on les fixe
      # donc ici egalement pour qu'un `docker compose up` recreant le conteneur
      # garde la bonne configuration. Pour un vrai SMTP, remplacer ces valeurs
      # (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_ENCRYPTION).
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    # --no-reload : sans ce drapeau, `artisan serve` ne transmet au sous-processus
    # `php -S` qu'une liste blanche de variables (APP_ENV, PATH, ...). Les
    # variables DB_* definies ci-dessus seraient ignorees et Laravel lirait le
    # DB_HOST=127.0.0.1 du .env local, qui ne pointe pas vers le conteneur db.
    # db:seed : les seeders sont idempotents (firstOrCreate) et creent les
    # comptes de demonstration deja verifies, utilisables sans numero reel.
    command: >
      sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: lost-found-api:latest
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    command: php artisan test --compact

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lost_found}
      POSTGRES_USER: ${DB_USERNAME:-lostfound}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lostfound2026}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lostfound} -d ${DB_DATABASE:-lost_found}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP : Laravel envoie ici
      - "8025:8025" # Interface web + API : http://localhost:8025
    restart: unless-stopped

volumes:
  db-data:
